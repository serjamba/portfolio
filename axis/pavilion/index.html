<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../assets/logos/favicon.svg"><title>Горизонт — 3D / AXIS</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#25332d;background:#d8d7d2;height:100dvh;display:flex;flex-direction:column}#stage{position:relative;flex:1;min-height:200px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none;outline-offset:-4px}#loading{position:absolute;inset:0;background:#d8d7d2 url('../assets/images/horizon-cover.webp') center/contain no-repeat;display:grid;place-items:end center;padding:24px;z-index:2}#loading span{background:#f6f4eff0;padding:14px}footer{background:#f4f2ed;padding:12px 20px;display:grid;gap:8px}nav{display:flex;flex-wrap:wrap;gap:6px}button{font:inherit;color:inherit;border:1px solid #9daba2;padding:9px 13px;background:transparent;cursor:pointer}button:hover{background:#e0e5df}button:disabled{opacity:.5;cursor:wait}button[aria-pressed=true]{background:#253c32;color:white}p{margin:0;line-height:1.45}#status{font-size:12px}#hint{max-width:100ch}#crosshair{display:none;position:absolute;left:50%;top:50%;pointer-events:none;color:white;text-shadow:0 1px 3px #000}.walking #crosshair{display:block}@media(max-width:600px){footer{padding:10px}button{font-size:12px;padding:8px}#hint{font-size:12px}}
</style></head><body><div id="stage"><div id="loading"><span role="status">Загружаем настоящую 3D-сцену…</span></div><span id="crosshair" aria-hidden="true">+</span></div><footer><nav aria-label="Управление моделью"><button id="reset" disabled>Внешний вид</button><button id="closer" disabled>Приблизить +</button><button id="farther" disabled>Отдалить −</button><button data-view="hall" disabled>Прихожая</button><button data-view="living" disabled>Кухня-гостиная</button><button data-view="terrace" disabled>Терраса</button><button id="walk" disabled>Войти в павильон</button><button id="exit" hidden>Выйти из прогулки · Esc</button><button id="close">К изображению ×</button></nav><p id="hint">Потяните модель мышью или пальцем для вращения. Масштаб — колесо или кнопки. Для прогулки нужны клавиатура и мышь; на телефоне используйте готовые ракурсы.</p><p id="status" role="status">Презентационный кадр во время загрузки. Свет и отражения в WebGL отличаются.</p></footer><script type="module">document.querySelector('#close').onclick=()=>parent.postMessage('axis:close',location.origin);import('./viewer.js').catch(e=>{document.querySelector('#loading span').textContent='3D недоступна. Вернитесь к изображению или перезагрузите просмотр.';document.querySelector('#status').textContent='Не удалось загрузить сцену: '+e.message;console.error(e)})</script></body></html>
